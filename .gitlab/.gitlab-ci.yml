# GitLab CI/CD Pipeline
# Equivalent translation of GitHub Actions: agent_sync, ci, docs, release

stages:
  - sync
  - test
  - docs
  - release

# ==========================================
# STAGE: SYNC (agent_sync.yml)
# ==========================================
agent-backlog-sync:
    stage: sync
    image: python:3.12
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
          changes:
              - "docs/moon/ROADMAP.md"
              - "docs/moon/CHANGELOG.md"
        - if: '$CI_PIPELINE_SOURCE == "web"'
    before_script:
        - pip install uv
        - uv sync --project git
    script:
        - uv run --project git python -c "import json,pathlib; json.loads(pathlib.Path('git/config/project_labels.json').read_text())"
        - uv run --project git python -c "import yaml,pathlib; yaml.safe_load(pathlib.Path('git/config/automation_rules.yaml').read_text())"
        - uv run --project git python -m git.scripts.sync_backlog --repo-owner ACFHarbinger --repo-name Android-Game-Template --project-id "$PROJECT_ID"
    variables:
        GITHUB_TOKEN: $PROJECT_AUTOMATION_TOKEN

lint-and-unit-test:
  extends: .gradle_base
  stage: test
  script:
    - ./gradlew ktlintCheck
    - ./gradlew lintDebug
    - ./gradlew testDebugUnitTest
  artifacts:
    when: always
    paths:
      - app/build/test-results/testDebugUnitTest/
      - app/build/reports/jacoco/
    reports:
      junit: app/build/test-results/testDebugUnitTest/**/TEST-*.xml
  # codecov/codecov-action has a GitLab-compatible upload path too (Codecov
  # accepts uploads from any CI via its `codecov` uploader binary or the
  # `CODECOV_TOKEN` + bash uploader) -- add a `codecov` step here if code
  # coverage reporting to Codecov is wanted on GitLab; omitted rather than
  # guessed at without a token/config to test against.

build-debug:
  extends: .gradle_base
  stage: test
  needs: ["lint-and-unit-test"]
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk

instrumented-tests:
  extends: .gradle_base
  stage: test
  needs: ["lint-and-unit-test"]
  # GitLab's shared runners typically don't expose /dev/kvm for nested
  # virtualization the way GitHub-hosted runners do -- this job needs a
  # self-hosted runner with KVM access (same underlying requirement
  # reactivecircus/android-emulator-runner has on GitHub, not a GitLab-
  # specific gap). Left as a direct Gradle invocation (no emulator-runner
  # action exists for GitLab) assuming the runner already has an emulator/
  # KVM set up; this is the one job most likely to need environment-specific
  # adjustment on a real GitLab runner.
  parallel:
    matrix:
      - API_LEVEL: [29, 35]
  script:
    - echo "Requires a runner with KVM + an Android emulator image for API level ${API_LEVEL} already provisioned."
    - ./gradlew connectedDebugAndroidTest

# ==========================================
# STAGE: DOCS (GitLab Pages)
# ==========================================
# This special job name "pages" is required by GitLab to deploy to GitLab Pages
pages:
  stage: docs
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
  script:
    - pip install mkdocs-material
    # GitLab Pages requires the output directory to be named "public"
    - mkdocs build --config-file docs/mkdocs.yml --strict --site-dir public
  artifacts:
    paths:
      - public

# ==========================================
# STAGE: RELEASE
# ==========================================
release:
  stage: release
  image: eclipse-temurin:17-jdk
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - |
      if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
      else
        echo "No ANDROID_KEYSTORE_BASE64 variable configured — skipping signed build steps that require it." >&2
      fi
    - export ANDROID_KEYSTORE_PATH="${CI_PROJECT_DIR}/release.keystore"
    - ./gradlew bundleRelease assembleRelease
    # GitLab's native Releases feature is created via the `release` keyword
    # + `release-cli` (bundled in GitLab-hosted runner images), which
    # publishes release notes/metadata but does not itself attach binary
    # assets the way GitHub Releases does -- assets are uploaded to the
    # GitLab Package Registry / generic packages API instead, then linked.
    - |
      for f in app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk; do
        NAME="$(basename "$f")"
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${CI_COMMIT_TAG}/${NAME}"
      done
  artifacts:
    paths:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
  # Note: ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/
  # ANDROID_KEY_PASSWORD must be configured in GitLab CI/CD Settings ->
  # Variables (masked/protected) for signed builds.
