name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured — skipping signed build steps that require it." >&2
          fi

      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK (for smoke-testing / direct distribution)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # softprops/action-gh-release is GitHub-Releases-specific (uses the
      # GitHub REST API's release-notes generation). Forgejo/Gitea have
      # their own Releases feature with a compatible REST API (both are
      # Gitea-API-schema releases/assets endpoints) -- create the release
      # and upload each asset directly via curl instead of a managed action.
      # generate_release_notes (auto-generated notes from merged PRs) has no
      # direct equivalent here; the release body is left minimal instead of
      # guessing at a replacement.
      - name: Create Forgejo/Gitea Release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          RELEASE_JSON=$(curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag, draft: false, prerelease: false}')" \
            "${API}/releases")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Failed to create release: $RELEASE_JSON"
            exit 1
          fi

          shopt -s nullglob
          for f in app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk; do
            NAME="$(basename "$f")"
            curl -sS -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: multipart/form-data" \
              -F "attachment=@${f}" \
              "${API}/releases/${RELEASE_ID}/assets?name=${NAME}"
          done

      # Optional: upload straight to Google Play via fastlane supply.
      # Requires a Play Console service-account JSON stored as the
      # PLAY_STORE_SERVICE_ACCOUNT_JSON secret. Uncomment once configured.
      # - name: Set up fastlane
      #   run: |
      #     gem install bundler
      #     bundle install
      # - name: Upload to Play Store (internal track)
      #   env:
      #     SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      #   run: |
      #     bundle exec fastlane supply \
      #       --aab app/build/outputs/bundle/release/app-release.aab \
      #       --track internal \
      #       --package_name com.example.gametemplate

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
