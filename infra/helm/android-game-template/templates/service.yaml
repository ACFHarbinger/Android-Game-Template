apiVersion: v1
kind: Service
metadata:
  name: {{ include "android-game-template.fullname" . }}
  labels:
    {{- include "android-game-template.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "android-game-template.labels" . | nindent 4 }}
